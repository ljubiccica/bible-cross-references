name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Redeploy by hand, e.g. after changing the Pages settings.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Type check, lint, format, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The sources too large to keep in the repository (see data/raw/README.md) are downloaded by
      # the build: the KJV archive and the tagged Hebrew and Greek, about 110 MB in all. The key
      # is the whole pin file, so any re-pin fetches all of them again — which is the safe way
      # round, since the build refuses a local file that does not match its pin rather than
      # replacing it. Between re-pins nothing is downloaded, so a day when an upstream host is
      # down does not stop a deployment.
      - name: Cache the downloaded sources
        uses: actions/cache@v6
        with:
          path: data/raw
          key: raw-data-${{ hashFiles('data/sources.json') }}
      - run: npm run check
      - run: npm run build
      - name: Keep the built site for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Publishes main to trekhleb.dev/bible-cross-references/, once every check has passed. The domain
  # comes from the owner's user site; builds already use the /bible-cross-references/ base path.
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a running one always finishes.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
